name: Build Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build type to generate"
        required: true
        default: "both"
        type: choice
        options:
          - "both"
          - "debug"
          - "release"

permissions:
  contents: write

jobs:
  build:
    name: Build & Generate APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a2a10e4421829d33d5d210f47d1" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "85642a32e8354c21a456e15339f4528d75a30258" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Ensure Debug Keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore for APK signing..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == 'debug' }}
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == 'release' }}
        run: gradle assembleRelease --no-daemon

      - name: Collect APK artifacts
        run: |
          mkdir -p apk-output
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk apk-output/ZevSafe-debug.apk
            echo "Found debug APK: ZevSafe-debug.apk"
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk apk-output/ZevSafe-release.apk
            echo "Found release APK: ZevSafe-release.apk"
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk apk-output/ZevSafe-release-unsigned.apk
            echo "Found release APK: ZevSafe-release-unsigned.apk"
          fi
          ls -la apk-output

      - name: Upload APKs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZevSafe-Android-APKs
          path: apk-output/*.apk
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-output/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
